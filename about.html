<style>
* { margin:0; padding:0; box-sizing:border-box; }

/* 底部导航 */

.nav button { flex:1; padding:14px 0; border:none; background:#fff; font-size:15px; color:#666; cursor:pointer; }
.nav button.active { color:#1a237e; font-weight:700; border-top:2px solid #1a237e; }

/* 页面容器 */
.page { display:none; padding:20px 20px 80px; max-width:680px; margin:0 auto; }
.page.active { display:block; }

/* 刷题区 */
.word-display { font-size:36px; font-weight:700; text-align:center; margin:30px 0 20px; }
.options { display:flex; flex-direction:column; gap:12px; margin:20px 0; }
.option { padding:16px 20px; border:2px solid #e0e0e0; border-radius:10px; font-size:18px; cursor:pointer; background:#fff; text-align:left; transition:0.15s; }
.option:hover { border-color:#1a237e; }
.option.selected { border-color:#1a237e; background:#e8eaf6; }
.option.correct { border-color:#4caf50; background:#e8f5e9; }
.option.wrong { border-color:#f44336; background:#fce4ec; }
.option.locked { pointer-events:none; }

#confirmBtn, #nextBtn { width:100%; padding:14px; font-size:16px; border:none; border-radius:10px; cursor:pointer; margin-top:10px; }
#confirmBtn { background:#1a237e; color:#fff; display:none; }
#nextBtn { background:#e8eaf6; color:#1a237e; display:none; }

/* 结果卡片 */
.result-card { margin-top:20px; padding:20px; background:#f5f5f5; border-radius:12px; display:none; }
.result-card .judge { font-size:22px; font-weight:700; margin-bottom:10px; }
.result-card .rc-word { font-size:28px; font-weight:700; margin-bottom:4px; }
.result-card .rc-phonetic { color:#666; margin-bottom:8px; }
.result-card .rc-mean { font-size:17px; margin-bottom:6px; }
.result-card .rc-ex { font-size:14px; color:#555; line-height:1.6; margin-top:8px; padding-top:8px; border-top:1px solid #ddd; }

/* 错题本 */
.wrong-item { padding:14px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center; }
.wrong-item .wi-word { font-size:18px; font-weight:600; }
.wrong-item .wi-mean { font-size:14px; color:#666; }
.wrong-item button { padding:6px 14px; border:1px solid #f44336; background:#fff; color:#f44336; border-radius:6px; cursor:pointer; font-size:13px; }

/* 导入区 */
.import-box { margin-top:20px; padding:20px; border:2px dashed #ccc; border-radius:12px; text-align:center; }
.import-box input { display:none; }
.import-box label { display:block; padding:20px; cursor:pointer; color:#666; }

/* 进度 */
.progress { text-align:center; color:#999; font-size:13px; margin-top:10px; }
</style>

const STORAGE_KEY = 'cet4_vocab';
const WRONG_KEY = 'cet4_wrong';

// 初始化：若 localStorage 无词库，写入内置
if (!localStorage.getItem(STORAGE_KEY)) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(BUILTIN_WORDS));
}

let vocab = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
let currentWord = null;
let currentOptions = [];
let selectedIdx = -1;
let answered = false;

const wordDisplay = document.getElementById('wordDisplay');
const optionsArea = document.getElementById('optionsArea');
const confirmBtn = document.getElementById('confirmBtn');
const nextBtn = document.getElementById('nextBtn');
const resultCard = document.getElementById('resultCard');
const progress = document.getElementById('progress');

function getRandomInt(max) { return Math.floor(Math.random() * max); }

function levenshtein(a, b) {
  const m = a.length, n = b.length;
  if (m < n) return levenshtein(b, a);
  let prev = Array.from({length: n+1}, (_, i) => i);
  for (let i = 1; i <= m; i++) {
    let curr = [i];
    for (let j = 1; j <= n; j++) {
      curr[j] = Math.min(curr[j-1]+1, prev[j]+1, prev[j-1]+(a[i-1]!==b[j-1]?1:0));
    }
    prev = curr;
  }
  return prev[n];
}

function pickDistractors(correctWord, count) {
  const cPos = (correctWord.meanings[0] || {}).partOfSpeech || '';
  const cSpell = correctWord.spelling.toLowerCase();
  let candidates = vocab.filter(w => {
    if (w.spelling === correctWord.spelling) return false;
    const wPos = (w.meanings[0] || {}).partOfSpeech || '';
    if (cPos && wPos && cPos !== wPos) return false;
    return true;
  });
  candidates.sort((a, b) => {
    const da = levenshtein(a.spelling.toLowerCase(), cSpell);
    const db = levenshtein(b.spelling.toLowerCase(), cSpell);
    return da - db;
  });
  return candidates.slice(0, count).map(w => {
    const m = w.meanings[0] || {};
    return (m.partOfSpeech ? m.partOfSpeech + ' ' : '') + (m.definition || '');
  });
}

function newQuestion() {
  answered = false;
  selectedIdx = -1;
  resultCard.style.display = 'none';
  resultCard.innerHTML = '';
  nextBtn.style.display = 'none';
  confirmBtn.style.display = 'none';
  optionsArea.innerHTML = '';

  currentWord = vocab[getRandomInt(vocab.length)];
  const correctDef = ((currentWord.meanings[0] || {}).partOfSpeech ? (currentWord.meanings[0].partOfSpeech + ' ') : '') + ((currentWord.meanings[0] || {}).definition || '');
  const distractors = pickDistractors(currentWord, 3);
  currentOptions = [correctDef, ...distractors];
  // shuffle
  for (let i = currentOptions.length - 1; i > 0; i--) {
    const j = getRandomInt(i + 1);
    [currentOptions[i], currentOptions[j]] = [currentOptions[j], currentOptions[i]];
  }

  wordDisplay.textContent = currentWord.spelling;
  currentOptions.forEach((opt, i) => {
    const div = document.createElement('div');
    div.className = 'option';
    div.textContent = opt;
    div.onclick = () => {
      if (answered) return;
      document.querySelectorAll('.option').forEach(o => o.classList.remove('selected'));
      div.classList.add('selected');
      selectedIdx = i;
      confirmBtn.style.display = 'block';
    };
    optionsArea.appendChild(div);
  });
  progress.textContent = `词库共 ${vocab.length} 词`;
}

confirmBtn.onclick = () => {
  if (selectedIdx < 0 || answered) return;
  answered = true;
  confirmBtn.style.display = 'none';
  document.querySelectorAll('.option').forEach((o, i) => {
    o.classList.add('locked');
    const correctDef = ((currentWord.meanings[0] || {}).partOfSpeech ? (currentWord.meanings[0].partOfSpeech + ' ') : '') + ((currentWord.meanings[0] || {}).definition || '');
    if (i === selectedIdx && currentOptions[i] === correctDef) {
      o.classList.add('correct');
    } else if (currentOptions[i] === correctDef) {
      o.classList.add('correct');
    } else if (i === selectedIdx) {
      o.classList.add('wrong');
    }
  });

  const isCorrect = currentOptions[selectedIdx] === (((currentWord.meanings[0] || {}).partOfSpeech ? (currentWord.meanings[0].partOfSpeech + ' ') : '') + ((currentWord.meanings[0] || {}).definition || ''));
  resultCard.style.display = 'block';
  let html = `<div class="judge">${isCorrect ? '✅ 正确' : '❌ 错误'}</div>`;
  html += `<div class="rc-word">${currentWord.spelling}</div>`;
  currentWord.meanings.forEach(m => {
    html += `<div class="rc-mean">${m.partOfSpeech ? m.partOfSpeech + ' ' : ''}${m.definition}</div>`;
  });
  if (currentWord.example && (currentWord.example.english || currentWord.example.chinese)) {
    html += `<div class="rc-ex">${currentWord.example.english || ''}<br>${currentWord.example.chinese || ''}</div>`;
  }
  resultCard.innerHTML = html;

  if (!isCorrect) {
    const wrongs = JSON.parse(localStorage.getItem(WRONG_KEY) || '[]');
    if (!wrongs.find(w => w.spelling === currentWord.spelling)) {
      wrongs.push(currentWord);
      localStorage.setItem(WRONG_KEY, JSON.stringify(wrongs));
    }
  }
  nextBtn.style.display = 'block';
};

nextBtn.onclick = newQuestion;

// 文件导入
document.getElementById('fileInput').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = ev => {
    try {
      const lines = ev.target.result.trim().split(/\r?\n/);
      const data = lines.map(l => JSON.parse(l));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      vocab = data;
      alert(`✅ 已导入 ${data.length} 词`);
      newQuestion();
    } catch(err) { alert('❌ 解析失败：' + err.message); }
  };
  r.readAsText(f);
};

// Tab 切换
function switchTab(tab) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
  if (tab === 'study') {
    document.getElementById('page-study').classList.add('active');
    document.querySelectorAll('.nav button')[0].classList.add('active');
  } else {
    document.getElementById('page-wrong').classList.add('active');
    document.querySelectorAll('.nav button')[1].classList.add('active');
    renderWrong();
  }
}

function renderWrong() {
  const list = document.getElementById('wrongList');
  const wrongs = JSON.parse(localStorage.getItem(WRONG_KEY) || '[]');
  list.innerHTML = '';
  if (wrongs.length === 0) { list.innerHTML = '<p style="color:#999">暂无错题</p>'; return; }
  wrongs.forEach((w, i) => {
    const div = document.createElement('div');
    div.className = 'wrong-item';
    const def = (w.meanings[0] || {}).definition || '';
    div.innerHTML = `<div><div class="wi-word">${w.spelling}</div><div class="wi-mean">${def}</div></div><button onclick="removeWrong(${i})">移出</button>`;
    list.appendChild(div);
  });
}

window.removeWrong = function(i) {
  const wrongs = JSON.parse(localStorage.getItem(WRONG_KEY) || '[]');
  wrongs.splice(i, 1);
  localStorage.setItem(WRONG_KEY, JSON.stringify(wrongs));
  renderWrong();
};

// 启动
newQuestion();
</script>
